app: kolibri
idea_app_version: "1.0"

compatibility:
  engine_min: "0.9.0"       # minimum Engine version this App Disk requires
  # 1.2-0.19.5 (setup.coach, idea#462): on-Pi check on idea03 at 47fea44, compose as shipped (zeroconf on, no override), throwaway project kidk21: setup.coach 5/4, collector 4, 0 restarts.
  # Needs net.ipv4.igmp_max_memberships above the host's Docker network count (docs/releases.md Known issue); idea03 had 1024.
  engine_tested:
    commit: "537b16d"
    version: "1.0"
    date: "2026-11-12"

services:
  - name: kolibri
    build: retag
    upstream: learningequality/kolibri
    upstream_tag: "0.19.5"
    image: koenswings/kolibri
    current_version: "1.1-0.19.5"
    monitors:
      - kind: http-scrape
        url: "https://learningequality.org/r/kolibri-latest-whl"
        pattern: "kolibri-(?P<version>[\\d.]+(\\.dev\\d+)?)"
        notes: "Kolibri is distributed as a .whl (Python wheel). Monitor the latest release page."

# Demo pack + hook (engine-dev#369, pack v1). setupDemo writes x-app.demo on the
# instance compose; the app bundle does not ship that key. The pack pin is the
# sha256 of the public release asset idea-demo-kolibri-v4.tar (built on the box;
# the asset is published after the QC gate, not by this PR).
# minEngine must be the Engine version that first advertises the demoApps
# capability — confirm with Axle when that release is tagged.
demo:
  name: "Kolibri Demo"
  minEngine: "1.0"
  pack:
    file: idea-demo-kolibri-v4.tar
    url: https://github.com/koenswings/app-kolibri/releases/download/idea-demo-kolibri-v4/idea-demo-kolibri-v4.tar
    sha256: "4675019f2c2a77d34b055788aeb5025c73c42ffe6f91dca55cdaa2213f414b23"
    bytes: 192430080
    minVersion: 3
  reserveBytes: 300000000
  steps:
    - { id: seed,      run: demo/hook.sh seed,      needs: stopped, timeoutSec: 1800 }
    - { id: classwork, run: demo/hook.sh classwork, needs: running, timeoutSec: 600 }
