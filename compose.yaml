x-app:
  name: kolibri
  title: Kolibri
  description: >
    Kolibri is an adaptable set of open solutions specially developed to support
    learning for the half of the world without Internet access. 

    Centered around an offline-first learning platform that runs on a variety of low-cost and legacy devices, the Kolibri Product Ecosystem includes a curricular tool, a library of open educational resources, and a toolkit of resources to support training and implementation in formal, informal, and non-formal learning environments.
  url: https://learningequality.org/kolibri/
  category: education
  icon: icon.png
  author: Koen Swings
  version: 5ab9f6428b7143c42feee29cc4b9bf950bab3b3e
  instanceName: kolibri
services:
  kolibri:
    image: koenswings/kolibri:1.0-0.15.5-dev
    init: true
    # r40: image CMD daemonized then tailed the log; Bus EXITED left only the tailer → Docker Up
    # while :port was dead. Foreground makes Kolibri PID1; healthcheck + on-failure restart.
    # Image already accepts `start --foreground` (Learning Equality CLI).
    command: ["./kolibri-0.15.5", "start", "--foreground"]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:$${KOLIBRI_HTTP_PORT:-8080}/', timeout=2)\""]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s
    restart: on-failure
    pull_policy: never
    volumes:
      - ./data/docker:/docker/mnt
      - ./data/kolibri:/root/.kolibri
    network_mode: "host"        
    #ports:
    #  - ${port}:8080
    #  - 3000:3000
    environment:
      # Engine writes port= in instance .env for host-network; do not default to 8080
      # (collides with Console). Fixtures may still pin 18080 via their own .env.
      - KOLIBRI_HTTP_PORT=${port}
      - KOLIBRI_LISTEN_PORT=${port}
      # Unique Kolibri/Morango instance id per instance (idea kit, 2026-10-17). Kolibri 0.15.5 starts
      # every device from the same pre-migrated home template (same Morango DatabaseIDModel), and with
      # network_mode host every instance on one Engine has the same hostname, MAC and db path, so a real
      # Kolibri and its "Kolibri Demo" got the SAME instance_id. Morango hashes MORANGO_SYSTEM_ID into the
      # instance id; Engine hostname + instance port is unique across the kit. Existing data is kept: on the
      # next start Morango just records a new current InstanceIDModel.
      - MORANGO_SYSTEM_ID=idea-${hostname}-${port}
      - KOLIBRI_RUN_MODE=docker
      # Default accounts and their login scheme: see docs/accounts.md.
